include /etc/squid/common.conf
acl sandbox_host dstdomain sandbox
acl sandbox_port port 8194
acl sandbox_path urlpath_regex ^/v1/sandbox/
acl sandbox_methods method GET POST
# Exact internal exception MUST precede Safe_ports and private denial.
http_access allow sandbox_host sandbox_port sandbox_path sandbox_methods
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny private
http_access allow all
