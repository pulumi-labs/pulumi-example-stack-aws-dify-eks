include /etc/squid/common.conf
acl backend_host dstdomain agent
acl backend_port port 5050
acl stub_path urlpath_regex ^/agent-stub/
acl api_host dstdomain api
acl api_port port 5001
acl files_path urlpath_regex ^/files/
acl internal_methods method GET HEAD POST PUT DELETE PATCH OPTIONS
# Explicit destination, port and path exceptions, before all generic denies.
http_access allow backend_host backend_port stub_path internal_methods
http_access allow api_host api_port files_path internal_methods
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny private
http_access allow all
