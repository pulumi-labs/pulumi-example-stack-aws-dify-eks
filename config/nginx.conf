# Derived from langgenius/dify 8e689e8 docker/nginx; see DIFY-LICENSE.
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  access_log off;
  client_max_body_size 100m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # Only the label-constrained operator proxy can reach this listener.
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
  proxy_request_buffering off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    location = /healthz { return 200 'ok'; }
    location /console/api { proxy_pass http://api:5001; }
    location /api { proxy_pass http://api:5001; }
    location /v1 { proxy_pass http://api:5001; }
    location /openapi { proxy_pass http://api:5001; }
    location /files { proxy_pass http://api:5001; }
    location /mcp { proxy_pass http://api:5001; }
    location /triggers { proxy_pass http://api:5001; }
    location /callbacks/human-input/v2/im/ { proxy_pass http://api:5001; }
    location /socket.io/ {
      proxy_pass http://api:5001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location /agent-stub/ { proxy_pass http://agent:5050; }
    location /e/ {
      proxy_pass http://plugin:5002;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Dify-Hook-Url https://$host$request_uri;
    }
    location / { proxy_pass http://web:3000; }
  }
}
